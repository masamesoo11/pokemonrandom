# Cloudflare Pages configuration for Pokemon Random
# This file tells Cloudflare how to build and deploy the Next.js app.

# Build configuration
[build]
  command = "npx @cloudflare/next-on-pages@1"
  # Output directory where the built site lives (created by next-on-pages adapter)
  output_directory = ".vercel/output/static"

# Environment variables needed at build time
# Set these in the Cloudflare Pages dashboard (Settings → Environment variables):
#
# Required:
#   NEXT_PUBLIC_SITE_URL=https://pokemonrandom.com
#   ADMIN_PASSWORD=your-strong-password
#
# Optional (enable when ready):
#   NEXT_PUBLIC_GA_ID=G-XXXXXXXXXX
#   NEXT_PUBLIC_ADSENSE_CLIENT=ca-pub-XXXXXXXX
#   NEXT_PUBLIC_AD_SLOT_HEADER=1234567890
#   NEXT_PUBLIC_AD_SLOT_INCONTENT=2345678901
#   NEXT_PUBLIC_AD_SLOT_SIDEBAR=3456789012
#   NEXT_PUBLIC_AD_SLOT_FOOTER=4567890123
#   NEXT_PUBLIC_AD_SLOT_MOBILE=5678901234
#   NEXT_PUBLIC_SEARCH_CONSOLE=token

# Compatibility flags - required for Next.js on Cloudflare Pages
[build.environment]
  NEXT_ON_PAGES = "true"
  NODE_VERSION = "20"

# Headers for better SEO and security
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"

# Cache static assets aggressively
[[headers]]
  for = "/_next/static/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/icons/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/og-image.png"
  [headers.values]
    Cache-Control = "public, max-age=604800"

# Redirect www to non-www (uncomment after adding your domain)
# [[redirects]]
#   from = "https://www.pokemonrandom.com/*"
#   to = "https://pokemonrandom.com/:splat"
#   status = 301
#   force = true
