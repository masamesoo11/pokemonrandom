# ====================================================================
# Pokemon Random — Notifications (Slack + Discord)
# ====================================================================
# This is a REUSABLE workflow that other workflows call to send
# notifications to Slack and/or Discord.
#
# USAGE FROM ANOTHER WORKFLOW:
#   - name: Send notification
#     uses: ./.github/workflows/notify.yml
#     with:
#       status: ${{ job.status }}
#       environment: production
#     secrets: inherit
#
# REQUIRED SECRETS (set either or both):
#   SLACK_WEBHOOK_URL   — Slack incoming webhook URL
#   DISCORD_WEBHOOK_URL — Discord channel webhook URL
#
# HOW TO CREATE SLACK WEBHOOK:
#   1. Go to https://api.slack.com/messaging/webhooks
#   2. Click "Create your webhook"
#   3. Pick a channel (e.g. #deploys)
#   4. Copy the URL → add as GitHub Secret "SLACK_WEBHOOK_URL"
#
# HOW TO CREATE DISCORD WEBHOOK:
#   1. In Discord: Server Settings → Integrations → Webhooks
#   2. Click "New Webhook"
#   3. Pick a channel
#   4. Click "Copy Webhook URL" → add as GitHub Secret "DISCORD_WEBHOOK_URL"
# ====================================================================

name: Notify

on:
  workflow_call:
    inputs:
      status:
        description: "Job status (success, failure, cancelled)"
        required: true
        type: string
      environment:
        description: "Environment name (production, preview, staging)"
        required: false
        default: "production"
        type: string
      site-url:
        description: "Deployed site URL"
        required: false
        default: "https://pokemonrandom.com"
        type: string
    secrets:
      SLACK_WEBHOOK_URL:
        required: false
      DISCORD_WEBHOOK_URL:
        required: false

jobs:
  notify:
    name: Send Notifications
    runs-on: ubuntu-latest
    if: always()

    steps:
      # ===== Slack notification =====
      - name: 📢 Notify Slack
        if: ${{ secrets.SLACK_WEBHOOK_URL != '' }}
        uses: slackapi/slack-github-action@v1.26.0
        with:
          webhook-url: ${{ secrets.SLACK_WEBHOOK_URL }}
          webhook-type: incoming-webhook
          payload: |
            {
              "blocks": [
                {
                  "type": "header",
                  "text": {
                    "type": "plain_text",
                    "text": "${{ inputs.status == 'success' && '🚀 Deploy Succeeded' || '❌ Deploy Failed' }}",
                    "emoji": true
                  }
                },
                {
                  "type": "section",
                  "fields": [
                    {
                      "type": "mrkdwn",
                      "text": "*Repository:*\n${{ github.repository }}"
                    },
                    {
                      "type": "mrkdwn",
                      "text": "*Environment:*\n${{ inputs.environment }}"
                    },
                    {
                      "type": "mrkdwn",
                      "text": "*Branch:*\n${{ github.ref_name }}"
                    },
                    {
                      "type": "mrkdwn",
                      "text": "*Commit:*\n${{ github.sha }}"
                    }
                  ]
                },
                {
                  "type": "section",
                  "text": {
                    "type": "mrkdwn",
                    "text": "*Commit Message:*\n${{ github.event.head_commit.message }}"
                  }
                },
                {
                  "type": "actions",
                  "elements": [
                    {
                      "type": "button",
                      "text": {
                        "type": "plain_text",
                        "text": "🌐 Visit Site",
                        "emoji": true
                      },
                      "url": "${{ inputs.site-url }}",
                      "style": "primary"
                    },
                    {
                      "type": "button",
                      "text": {
                        "type": "plain_text",
                        "text": "📊 View Workflow",
                        "emoji": true
                      },
                      "url": "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
                    }
                  ]
                }
              ]
            }

      # ===== Discord notification =====
      - name: 📢 Notify Discord
        if: ${{ secrets.DISCORD_WEBHOOK_URL != '' }}
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          STATUS: ${{ inputs.status }}
          ENVIRONMENT: ${{ inputs.environment }}
          SITE_URL: ${{ inputs.site-url }}
          REPO: ${{ github.repository }}
          BRANCH: ${{ github.ref_name }}
          COMMIT_SHA: ${{ github.sha }}
          COMMIT_MSG: ${{ github.event.head_commit.message }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          EMOJI="✅"
          COLOR=65280  # green
          TITLE="Deploy Succeeded"
          if [ "$STATUS" = "failure" ]; then
            EMOJI="❌"
            COLOR=16711680  # red
            TITLE="Deploy Failed"
          elif [ "$STATUS" = "cancelled" ]; then
            EMOJI="🚫"
            COLOR=8421504  # grey
            TITLE="Deploy Cancelled"
          fi

          # Truncate commit message to 200 chars (Discord embed limit)
          SHORT_MSG=$(echo "$COMMIT_MSG" | head -c 200)

          # Build the JSON payload using jq for safety
          PAYLOAD=$(jq -n \
            --arg emoji "$EMOJI" \
            --arg title "$TITLE" \
            --arg color "$COLOR" \
            --arg repo "$REPO" \
            --arg env "$ENVIRONMENT" \
            --arg branch "$BRANCH" \
            --arg commit "$COMMIT_SHA" \
            --arg msg "$SHORT_MSG" \
            --arg site "$SITE_URL" \
            --arg run "$RUN_URL" \
            '{
              embeds: [{
                title: "\($emoji) \($title)",
                color: ($color | tonumber),
                fields: [
                  { name: "📦 Repository", value: $repo, inline: true },
                  { name: "🌍 Environment", value: $env, inline: true },
                  { name: "🌿 Branch", value: $branch, inline: true },
                  { name: "🔑 Commit", value: $commit[:7], inline: true },
                  { name: "💬 Message", value: $msg, inline: false }
                ],
                url: $run,
                description: "[🌐 Visit Site](\($site)) | [📊 View Workflow](\($run))",
                footer: { text: "Pokemon Random CI/CD" },
                timestamp: (now | todate)
              }]
            }')

          curl -X POST \
            -H "Content-Type: application/json" \
            -d "$PAYLOAD" \
            "$DISCORD_WEBHOOK_URL"
