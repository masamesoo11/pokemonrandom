name: Build and Deploy to Cloudflare Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Build Next.js site
        run: npx next build
        env:
          NEXT_PUBLIC_SITE_URL: https://pokemonrandom.com
          NEXT_PUBLIC_GA_ID: ${{ secrets.NEXT_PUBLIC_GA_ID }}
          NEXT_PUBLIC_SEARCH_CONSOLE: ${{ secrets.NEXT_PUBLIC_SEARCH_CONSOLE }}

      - name: Copy Cloudflare Pages config files
        run: |
          cp public/_headers out/_headers 2>/dev/null || true
          cp public/_redirects out/_redirects 2>/dev/null || true
          cp -r public/* out/ 2>/dev/null || true
          ls out/_headers out/_redirects 2>/dev/null

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy out/ --project-name=pokemonrandom --commit-dirty=true
