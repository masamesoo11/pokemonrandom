name: Build and Deploy to Cloudflare Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Build Next.js site
        run: npx next build
        env:
          NEXT_PUBLIC_SITE_URL: https://pokemonrandom.com
          NEXT_PUBLIC_GA_ID: ${{ secrets.NEXT_PUBLIC_GA_ID }}
          NEXT_PUBLIC_SEARCH_CONSOLE: ${{ secrets.NEXT_PUBLIC_SEARCH_CONSOLE }}

      - name: Verify build output
        run: |
          echo "Checking build output..."
          ls -la out/ 2>/dev/null || echo "out/ not found"
          ls -la .next/ 2>/dev/null | head -5
          if [ ! -d "out" ]; then
            echo "Creating out/ from .next/..."
            cp -r .next out 2>/dev/null || true
          fi
          cp -r public/* out/ 2>/dev/null || true
          echo "out/ contents:"
          ls out/ | head -10

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy out/ --project-name=pokemonrandom --commit-dirty=true
