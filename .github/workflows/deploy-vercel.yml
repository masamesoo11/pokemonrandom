# ====================================================================
# Pokemon Random — Deploy to Vercel
# ====================================================================
# This workflow builds and deploys the Next.js app to Vercel.
# Vercel is the official hosting platform for Next.js and offers
# the best compatibility (it's the company behind Next.js).
#
# REQUIRED GITHUB SECRETS (Settings → Secrets and variables → Actions):
#   VERCEL_TOKEN        — Vercel personal access token
#   VERCEL_ORG_ID       — Vercel team/org ID
#   VERCEL_PROJECT_ID   — Vercel project ID
#
# HOW TO GET THE VERCEL SECRETS:
#   1. VERCEL_TOKEN:
#      - Go to https://vercel.com/account/tokens
#      - Click "Create Token"
#      - Name it "GitHub Actions" and set scope to your project
#      - Copy the token
#
#   2. VERCEL_ORG_ID and VERCEL_PROJECT_ID:
#      - In your Vercel project: Settings → General
#      - Copy "Vercel ID" (ORG_ID) and "Project ID"
#
# ALTERNATIVE: Use the Vercel GitHub integration instead of this workflow
# (easier — automatically deploys on every push without Actions).
# ====================================================================

name: Deploy to Vercel

on:
  push:
    branches: [main, master]
  workflow_dispatch:

concurrency:
  group: vercel-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    name: Build & Deploy
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      # ===== 1. Checkout code =====
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      # ===== 2. Setup Bun =====
      - name: 🅱️ Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      # ===== 3. Install Vercel CLI =====
      - name: 📦 Install Vercel CLI
        run: bun add -g vercel

      # ===== 4. Pull Vercel environment =====
      - name: 🔄 Pull Vercel Environment
        run: vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

      # ===== 5. Build project =====
      - name: 🔨 Build Project
        run: vercel build --prod --token=${{ secrets.VERCEL_TOKEN }}
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

      # ===== 6. Deploy to Vercel =====
      - name: 🚀 Deploy to Vercel
        id: deploy
        run: |
          DEPLOY_URL=$(vercel deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }} 2>&1 | tail -1)
          echo "deploy-url=$DEPLOY_URL" >> $GITHUB_OUTPUT
          echo "Deployment URL: $DEPLOY_URL"
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

      # ===== 7. Output deployment summary =====
      - name: ✅ Deployment Summary
        if: always()
        run: |
          echo "## 🚀 Vercel Deployment Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          if [ "${{ job.status }}" = "success" ]; then
            echo "✅ **Status:** Successfully deployed!" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "🔗 **Deployment URL:** ${{ steps.deploy.outputs.deploy-url }}" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "📊 **Vercel Dashboard:** https://vercel.com/dashboard" >> $GITHUB_STEP_SUMMARY
          else
            echo "❌ **Status:** Deployment failed" >> $GITHUB_STEP_SUMMARY
            echo "Check logs above for details." >> $GITHUB_STEP_SUMMARY
          fi
