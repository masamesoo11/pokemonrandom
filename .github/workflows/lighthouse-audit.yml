# ====================================================================
# Pokemon Random — Lighthouse Audit
# ====================================================================
# This workflow runs a Lighthouse audit on the deployed site after
# every successful production deploy. It tracks performance,
# accessibility, SEO, and best practices scores over time.
#
# SCORE THRESHOLDS (configurable below):
#   Performance:        >= 80
#   Accessibility:      >= 90
#   Best Practices:     >= 90
#   SEO:                >= 90
#
# If any score falls below the threshold, the workflow fails (but
# doesn't block deployment — it runs AFTER deploy completes).
#
# REQUIRED SECRETS:
#   (none — uses the public Lighthouse CI action)
#
# OPTIONAL SECRETS (for Lighthouse CI server - historical tracking):
#   LHCI_SERVER_URL     — URL of your Lighthouse CI server
#   LHCI_TOKEN          — Token for the LHCI server
# ====================================================================

name: Lighthouse Audit

on:
  # Run after every successful production deploy
  workflow_run:
    workflows: ["Deploy to Cloudflare Pages", "Deploy to Vercel"]
    types:
      - completed
    branches: [main, master]

  # Manual trigger
  workflow_dispatch:
    inputs:
      site-url:
        description: "URL to audit (default: pokemonrandom.com)"
        required: false
        default: "https://pokemonrandom.com"

  # Scheduled: every Sunday at 2 AM UTC (weekly audit)
  schedule:
    - cron: "0 2 * * 0"

jobs:
  lighthouse:
    name: Run Lighthouse Audit
    runs-on: ubuntu-latest
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}

    steps:
      # ===== 1. Determine site URL =====
      - name: 🌐 Set site URL
        id: site
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ -n "${{ inputs.site-url }}" ]; then
            echo "url=${{ inputs.site-url }}" >> $GITHUB_OUTPUT
          else
            echo "url=https://pokemonrandom.com" >> $GITHUB_OUTPUT
          fi

      # ===== 2. Checkout code (needed for lighthouserc config) =====
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      # ===== 3. Run Lighthouse CI =====
      - name: 🔦 Run Lighthouse CI
        uses: treosh/lighthouse-ci-action@v11
        with:
          urls: |
            ${{ steps.site.outputs.url }}
            ${{ steps.site.outputs.url }}/about
            ${{ steps.site.outputs.url }}/privacy
            ${{ steps.site.outputs.url }}/#generator
            ${{ steps.site.outputs.url }}/#team
            ${{ steps.site.outputs.url }}/#wheel
          configPath: ./.github/lighthouserc.json
          uploadArtifacts: true
          temporaryPublicStorage: true

      # ===== 4. Generate summary report =====
      - name: 📊 Generate Summary
        if: always()
        run: |
          # Read the Lighthouse results
          RESULTS_DIR=".lighthouseci"
          if [ -d "$RESULTS_DIR" ]; then
            echo "## 🔦 Lighthouse Audit Report" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "Site audited: \`${{ steps.site.outputs.url }}\`" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY

            # Try to extract scores from the manifest
            MANIFEST=$(find $RESULTS_DIR -name "manifest.json" -print -quit)
            if [ -n "$MANIFEST" ] && [ -f "$MANIFEST" ]; then
              echo "📊 **Scores:**" >> $GITHUB_STEP_SUMMARY
              echo "" >> $GITHUB_STEP_SUMMARY
              echo "| URL | Performance | Accessibility | Best Practices | SEO |" >> $GITHUB_STEP_SUMMARY
              echo "|-----|-------------|---------------|----------------|-----|" >> $GITHUB_STEP_SUMMARY

              # Parse each URL's scores
              jq -r '.[] | "| \(.url) | \(.summary.performance * 100 | floor) | \(.summary.accessibility * 100 | floor) | \(.summary["best-practices"] * 100 | floor) | \(.summary.seo * 100 | floor) |"' "$MANIFEST" >> $GITHUB_STEP_SUMMARY 2>/dev/null || echo "| (parsing error) | - | - | - | - |" >> $GITHUB_STEP_SUMMARY
            else
              echo "⚠️ No manifest found" >> $GITHUB_STEP_SUMMARY
            fi

            echo "" >> $GITHUB_STEP_SUMMARY
            echo "📁 Full results uploaded as artifacts" >> $GITHUB_STEP_SUMMARY
          else
            echo "## ❌ Lighthouse Audit Failed" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "Check the logs above for details." >> $GITHUB_STEP_SUMMARY
          fi

      # ===== 5. Upload artifacts =====
      - name: 📁 Upload Lighthouse results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lighthouse-results
          path: .lighthouseci/
          retention-days: 30
