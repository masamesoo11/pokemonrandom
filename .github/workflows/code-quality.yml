# ====================================================================
# Pokemon Random — Code Quality Check
# ====================================================================
# This workflow runs on every push and PR to ensure code quality.
# It checks: TypeScript types, ESLint, build success.
# ====================================================================

name: Code Quality

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  quality:
    name: Lint + Build Check
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: write

    steps:
      # ===== 1. Checkout =====
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      # ===== 3. Setup Node =====
      - name: 📦 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      # ===== 4. Install deps =====
      - name: 📥 Install dependencies
        run: npm ci --legacy-peer-deps

      # ===== 5. TypeScript check =====
      - name: 🔍 TypeScript check
        id: tsc
        run: npx tsc --noEmit

      # ===== 6. ESLint =====
      - name: 🔍 ESLint
        id: lint
        run: npm run lint

      # ===== 7. Build check (Vercel-style build) =====
      - name: 🔨 Build check
        id: build
        run: npm run build
        env:
          NEXT_PUBLIC_SITE_URL: https://pokemonrandom.com
          ADMIN_PASSWORD: test-only-password

      # ===== 8. Summary =====
      - name: ✅ Quality Summary
        if: always()
        run: |
          echo "## 🔍 Code Quality Report" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Check | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|-------|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| TypeScript | ${{ steps.tsc.outcome == 'success' && '✅' || '⚠️' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| ESLint | ${{ steps.lint.outcome == 'success' && '✅' || '❌' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Build | ${{ steps.build.outcome == 'success' && '✅' || '⚠️' }} |" >> $GITHUB_STEP_SUMMARY
